<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Configuración inicial — LegalMev</title>
  <style>
    :root {
      --primary: #2A6A78;
      --accent:  #54A6A8;
      --bg:      #f4fafb;
      --text:    #1a3a42;
      --muted:   #5a7a82;
      --err:     #b42318;
      --ok:      #1b7a4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wizard {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(42,106,120,.13);
      max-width: 480px;
      width: 100%;
      padding: 40px;
    }

    /* Progress dots */
    .steps { display: flex; gap: 6px; margin-bottom: 36px; }
    .step-dot {
      flex: 1; height: 4px; border-radius: 2px;
      background: #d7e6e8; transition: background .2s;
    }
    .step-dot.done   { background: var(--primary); }
    .step-dot.active { background: var(--accent); }

    /* Logo */
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo-mark {
      width: 44px; height: 44px;
      background: var(--primary); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 17px; letter-spacing: -.5px;
    }
    .logo-text h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
    .logo-text p  { font-size: 12px; color: var(--muted); }

    h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

    /* Feature list */
    .features { list-style: none; margin-bottom: 32px; display: flex; flex-direction: column; gap: 12px; }
    .features li { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; }
    .feat-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: #e7f6f7; color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-top: 1px;
    }
    .features strong { display: block; margin-bottom: 2px; }

    /* Form */
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type=text],
    input[type=password] {
      width: 100%;
      border: 1.5px solid #d7e6e8;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: #f9fefe;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    input:focus { border-color: var(--accent); background: #fff; }
    .field-note { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .badge-opt {
      display: inline-block;
      background: #e7eef0; color: var(--muted);
      font-size: 11px; border-radius: 4px;
      padding: 1px 6px; margin-left: 6px;
      font-weight: 500; vertical-align: middle;
    }

    /* Buttons */
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
    .btn {
      width: 100%; border: none; border-radius: 8px;
      padding: 12px 16px; font-size: 14px; font-weight: 650;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: transparent; color: var(--muted); font-weight: 500; }
    .btn-ghost:hover:not(:disabled) { color: var(--text); }

    /* Error */
    .error-msg { color: var(--err); font-size: 13px; margin-top: 8px; min-height: 18px; }

    /* Done step */
    .success-wrap { text-align: center; padding: 8px 0 16px; }
    .success-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: #e6f7ef;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 24px;
    }
    .cred-saved { font-size: 13px; color: var(--ok); margin-bottom: 4px; }
    .done-note  { font-size: 13px; color: var(--muted); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wizard" id="wizard"></div>
  <script src="../credenciales/boveda.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
