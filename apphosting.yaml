# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 3
env:
  # Firebase Admin (servidor)
  - variable: APP_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
  - variable: APP_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: APP_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  # Bucket (no es sensible; FIREBASE_CONFIG también lo inyecta; firebase-admin tiene fallback)
  - variable: APP_STORAGE_BUCKET
    value: caseclarity-hij0x.firebasestorage.app
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
  # Mercado Pago (pagos Premium y colegios)
  - variable: MERCADOPAGO_ACCESS_TOKEN
    secret: MERCADOPAGO_ACCESS_TOKEN
  # Facturación ARCA vía NotificasHub (Notificas S.R.L.)
  - variable: NOTIFICASHUB_URL
    value: https://notificashub--studio-3864746689-59018.us-east4.hosted.app
  - variable: NOTIFICAS_BILLING_SHARED_SECRET
    secret: NOTIFICAS_BILLING_SHARED_SECRET
  - variable: MERCADOPAGO_HUB_EMIT_FACTURA
    value: "true"

  # Integración Notificas (descuento colegio 50% / registrado LegalMev 20%)
  - variable: NOTIFICAS_LEGALMEV_SHARED_SECRET
    secret: NOTIFICAS_LEGALMEV_SHARED_SECRET
  - variable: NOTIFICAS_PROMO_DISCOUNT_PERCENT
    value: "50"
  - variable: NOTIFICAS_PROMO_REGISTERED_DISCOUNT_PERCENT
    value: "20"
  - variable: NOTIFICAS_PROMO_FREE_SHIPMENTS
    value: "3"

  # Resend (emails de verificación con botón)
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: RESEND_FROM
    value: LegalMev <no-reply@legalmev.com.ar>

  # URLs en correos y redirects (www para coincidir con dominio público)
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://www.legalmev.com.ar

  # Firebase Cliente (NEXT_PUBLIC_* = build time, necesarias para Auth en producción)
  # Crear secrets con: firebase apphosting:secrets:set NOMBRE_SECRETO
  # Valores en: Firebase Console > Project Settings > General > Your apps (Web app)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: caseclarity-hij0x.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: caseclarity-hij0x
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: caseclarity-hij0x.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "911388046994"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID

# Variables de entorno: configurarlas en Firebase Console (Build > App Hosting > Settings > Environment)
# o aquí usando secret: para datos sensibles (crear con: firebase apphosting:secrets:set NOMBRE_SECRETO)
#
# Variables necesarias (ver .env.example):
#   NEXT_PUBLIC_FIREBASE_* (públicas)
#   FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_STORAGE_BUCKET
#   FIREBASE_PRIVATE_KEY (usar secret:)
#   GOOGLE_GENAI_API_KEY (usar secret: si aplica)
#   WHATSAPP_VERIFY_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_ACCESS_TOKEN (usar secret:)
#
# Ejemplo con secrets:
# env:
#   - variable: FIREBASE_PROJECT_ID
#     value: caseclarity-hij0x
#   - variable: FIREBASE_PRIVATE_KEY
#     secret: FIREBASE_PRIVATE_KEY
